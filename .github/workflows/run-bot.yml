name: Run bot

on:
  workflow_dispatch:      # деплой, сторож или само-продление
  repository_dispatch:    # внешний сторож (Cloudflare Worker и т.п.)

concurrency:
  group: bot
  cancel-in-progress: true   # инцидент 22.10 с откатом кода закрыт этим

permissions:
  contents: write
  actions: write          # само-продление вызывает workflow_dispatch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          DB_KEY: ${{ secrets.DB_KEY }}
          GH_RENEW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          while true; do
            python bot.py
            code=$?
            if [ "$code" = "42" ]; then
              echo "эстафета передана — завершаем джобу спокойно"
              exit 0
            fi
            echo "бот остановился ($code), перезапуск через 10с"
            sleep 10
          done
