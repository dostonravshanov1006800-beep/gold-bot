name: Watchdog

# Сторож: каждые 5 минут проверяет, жив ли ран бота (v11.36).
# Жив — тихо выходит (бот не трогаем, даунтайма нет).
# Мёртв — поднимает бота. Заменил cron в run-bot.yml, который
# каждые 15 минут гасил живого бота и давал ~1 мин простоя у всех.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Жив ли бот?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ACT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/run-bot.yml/runs?per_page=5")
          COUNT=$(echo "$ACT" | python3 -c "
          import json, sys
          runs = json.load(sys.stdin).get('workflow_runs', [])
          print(sum(1 for r in runs if r['status'] in ('in_progress', 'queued', 'waiting')))
          ")
          echo "активных ранов бота: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "бот жив — не трогаем"
            exit 0
          fi
          echo "бота нет — поднимаем"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/run-bot.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null -w "dispatch: %{http_code}\n"
